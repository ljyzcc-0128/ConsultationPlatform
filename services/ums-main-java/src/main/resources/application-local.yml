    user: ${UMS_MGMT_USER:ums_admin}
    password: ${UMS_MGMT_PASSWORD:1eAODIRLqpRazsxV}

  jingcai:
    enabled: true
    app-key: "dinggifxmjftbgbmhv3m"
    app-secret: "4ypqFxOLV2gG3wXozv-VkJmrhOJURnyu0FTiR8OBtvqfPN3eBkDEtiFI0nYOyiE1"                # 走环境变量，不入库（本地调试：export UMS_JINGCAI_APP_SECRET=<完整Secret>）
    agent-id: "5099743148"
    receivers: "971880798"                 # TODO：接收人钉钉 userid，逗号分隔
