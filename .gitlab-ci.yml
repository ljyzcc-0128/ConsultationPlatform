workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - build
  - test
  - package
  - deploy

variables:
  MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
  NODE_IMAGE: node:18-alpine
  DOCKER_IMAGE: docker:24.0.5-cli
  DEPLOY_PATH: /opt/ums

# ---------- Java 后端 ----------
backend:build-test:
  stage: build
  image: $MAVEN_IMAGE
  rules:
    - changes:
        - services/ums-main-java/**/*
  script:
    - cd services/ums-main-java
    # 指定阿里云 maven 镜像加速
    - mvn -s settings.xml -q test package -DskipTests
  cache:
    key: maven-repo
    paths:
      - services/ums-main-java/.m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/services/ums-main-java/.m2/repository"
  artifacts:
    when: always
    reports:
      junit: services/ums-main-java/target/surefire-reports/TEST-*.xml
    paths:
      - services/ums-main-java/target/*.jar
    expire_in: 1 week

# ---------- 前端 ----------
frontend:build-test:
  stage: build
  image: $NODE_IMAGE
  rules:
    - changes:
        - services/ums-web/**/*
  script:
    - cd services/ums-web
    - npm ci --registry=https://registry.npmmirror.com
    - npx tsc --noEmit
    - npm run build
  cache:
    key: npm-cache
    paths:
      - services/ums-web/.npm
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/services/ums-web/.npm"
  artifacts:
    paths:
      - services/ums-web/dist/
    expire_in: 1 week

# ---------- Python 爬虫 ----------
crawler:test:
  stage: test
  image: python:3.11-slim
  rules:
    - changes:
        - services/ums-crawler-py/**/*
  script:
    - cd services/ums-crawler-py
    - pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements.txt
    - mkdir -p reports && python -m pytest --junitxml=reports/junit.xml
  cache:
    key: pip-cache
    paths:
      - services/ums-crawler-py/.pip-cache
  artifacts:
    when: always
    reports:
      junit: services/ums-crawler-py/reports/junit.xml
    expire_in: 1 week
  allow_failure: true

# ---------- 打包 Docker 镜像 ----------
package:images:
  stage: package
  image: $DOCKER_IMAGE
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      changes:
        - services/ums-main-java/**/*
        - services/ums-web/**/*
        - services/ums-crawler-py/**/*
  script:
    - if [ -d "services/ums-web/dist" ]; then cd services/ums-web && docker build -t local/ums-web:latest . && cd ../..; fi
    - if ls services/ums-main-java/target/*.jar >/dev/null 2>&1; then cd services/ums-main-java && docker build -t local/ums-main-java:latest . && cd ../..; fi
    - if [ -d "services/ums-crawler-py" ]; then cd services/ums-crawler-py && docker build -t local/ums-crawler-py:latest . && cd ../..; fi

# ---------- 部署 ----------
deploy:local:
  stage: deploy
  image: $DOCKER_IMAGE
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"
      when: manual
  script:
    # app.env 实际位于 /opt/ums/configs/app.env；compose env_file 要求 /opt/ums/app/app.env
    # UMS_APP_ENV（GitLab 文件型变量）若配置则优先覆盖
    - mkdir -p /opt/ums/app
    - if [ -f /opt/ums/configs/app.env ]; then cp -f /opt/ums/configs/app.env /opt/ums/app/app.env; fi
    - if [ -n "$UMS_APP_ENV" ] && [ -f "$UMS_APP_ENV" ]; then cp -f "$UMS_APP_ENV" /opt/ums/app/app.env; fi
    # 仓库 compose 为唯一事实来源，部署前同步到服务器
    - cp -f deploy/docker-compose.prod.yml /opt/ums/docker-compose.yml
    - cd $DEPLOY_PATH
    - docker compose up -d --force-recreate ums-web ums-main-java ums-crawler-py
    - docker image prune -f
