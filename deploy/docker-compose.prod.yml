# 生产环境 Docker Compose（方案 A 全容器化）
# 与服务器 /opt/ums/docker-compose.yml 保持一致；修改先改本文件再同步。
# 依赖：/opt/ums/.env（MYSQL_ROOT_PASSWORD / RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS）
#       /opt/ums/app/app.env（原生部署遗留的真实配置：SSO/JWT/AI/SMM 等，由 env_file 继承）
services:
  mysql:
    image: mysql:8.0
    container_name: ums-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d   # 01-users.sql + 02-tables_xxl_job.sql（data 目录为空时执行）
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 12
    networks: [ums-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ums-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
    networks: [ums-net]

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.0
    container_name: ums-xxl-job
    restart: always
    environment:
      PARAMS: '--spring.datasource.url=jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai --spring.datasource.username=root --spring.datasource.password=${MYSQL_ROOT_PASSWORD}'
    ports:
      - "8088:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [ums-net]

  ums-main-java:
    image: local/ums-main-java:latest
    container_name: ums-main-java
    restart: always
    env_file:
      - /opt/ums/app/app.env          # 继承 SSO/JWT/AI/MGMT 等真实配置
    ports:
      - "8080:8080"
      - "9999:9999"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Shanghai
      UMS_MYSQL_HOST: mysql           # environment 覆盖 env_file 中的旧地址
      UMS_MYSQL_DB: cp_news
      UMS_MYSQL_USER: ums_app
      UMS_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UMS_MQ_HOST: rabbitmq
      UMS_MQ_USER: ${RABBITMQ_DEFAULT_USER}
      UMS_MQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      UMS_AI_ENABLED: "true"
      UMS_AI_BASE_URL: https://open.bigmodel.cn/api/paas/v4
      UMS_AI_MODEL: glm-4-flash
      # UMS_AI_API_KEY 由 env_file(/opt/ums/app/app.env) 提供，勿在此写占位值覆盖真实 Key
      UMS_CRAWLER_URL: http://ums-crawler-py:8100
      XXL_JOB_ADMIN_ADDRESSES: http://xxl-job-admin:8080/xxl-job-admin
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      xxl-job-admin:
        condition: service_started
    networks: [ums-net]

  ums-crawler-py:
    image: local/ums-crawler-py:latest
    container_name: ums-crawler-py
    restart: always
    env_file:
      - /opt/ums/app/app.env          # 继承 SMM/SCI99 等凭据
    ports:
      - "8100:8100"
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      INTERNAL_API_BASE_URL: http://ums-main-java:8080/api
      # 海外信源走代理时在此追加：HTTP_PROXY: http://<proxy>:<port>
    depends_on:
      - rabbitmq
      - ums-main-java
    networks: [ums-net]

  ums-web:
    image: local/ums-web:latest
    container_name: ums-web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/default.conf:/etc/nginx/conf.d/default.conf:Z   # :Z 解决 SELinux 挂载
    depends_on:
      - ums-main-java
      - ums-crawler-py
    networks: [ums-net]

networks:
  ums-net:
    driver: bridge
