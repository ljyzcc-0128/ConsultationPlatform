spring:
  application:
    name: ums-main

  # 默认激活 dev，生产通过启动参数/环境变量覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # Flyway 公共配置（连接信息在各自 profile 中）
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 业务公共开关（具体值在 profile 中定义）
ums:
  ai:
    enabled: true
    model: glm-4-flash
    timeout-seconds: 60
    base-url: https://open.bigmodel.cn/api/paas/v4

  security:
    jwt:
      ttl-minutes: 480
    default-provider: LOCAL
    iam:
      enabled: false
      auth-mode: API_KEY
      timeout-seconds: 10
      auto-provision: true
      default-roles: USER
    sso:
      enabled: false
      authorize-url: https://iam.jinkosolar.com/sso/oidc1/dAuthorize
      timeout-seconds: 10
      auto-provision: true
      default-roles: USER

  scheduler:
    trigger-limit: 10

  jingcai:
    enabled: false
    timeout-seconds: 10
    # 接收人自动订阅：SSO/IAM 登录过的用户自动纳入日报接收名单（external_id=工号=钉钉userid）
    auto-subscribe: true
    # 日报头部 AI 综述（依赖 ums.llm 配置，未配置或调用失败自动降级纯数据版）
    ai-summary: true

  llm:
    # LLM 统一接入层（OpenAI 兼容协议），GLM 公网/公司网关/内网 vLLM 均可通过环境变量切换
    # 未配置时调用 LlmAdapter 会报明确错误，不影响应用启动
    base-url: ${UMS_LLM_BASE_URL:}      # 如 GLM: https://open.bigmodel.cn/api/paas/v4
    api-key: ${UMS_LLM_API_KEY:}        # 仅环境变量，不进仓库
    model: ${UMS_LLM_MODEL:}            # 如 glm-4-flash
    timeout-seconds: 60

  xxl-job:
    enabled: false
    appname: ums-main-executor
    port: 9999
    # 调度中心管理接口（管理后台定时任务维护列表用），账号密码与 xxl-job-admin 一致
    admin-addresses: ${UMS_XXL_ADMIN:}
    username: ${UMS_XXL_USER:admin}
    password: ${UMS_XXL_PASSWORD:123456}
    # 执行器日志目录：不配置则用 xxl 默认（/data/applogs/xxl-job/jobhandler，仅 Linux 可用）
    log-path: ${UMS_XXL_LOG_PATH:}

logging:
  level:
    com.example.ums: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info