spring:
  datasource:
    url: jdbc:mysql://${UMS_MYSQL_HOST:127.0.0.1}:${UMS_MYSQL_PORT:3306}/${UMS_MYSQL_DB:cp_news}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${UMS_MYSQL_USER:root}
    password: ${UMS_MYSQL_PASSWORD:root1234}

  rabbitmq:
    host: ${UMS_MQ_HOST:127.0.0.1}
    port: ${UMS_MQ_PORT:5672}
    username: ${UMS_MQ_USER:ums_admin}
    password: ${UMS_MQ_PASSWORD:1eAODIRLqpRazsxV}
    virtual-host: /

ums:
  ai:
    enabled: ${UMS_AI_ENABLED:true}
    api-key: ${UMS_AI_API_KEY:9e3b495236444c79b60596367f54eedc.xq6e6CmcqEuE7TBA}          # 本地可留空，功能自动降级

