    ip: 127.0.0.1
    # 执行器日志目录：macOS 无法在只读根目录创建 /data/applogs，落到用户目录
    log-path: ${user.home}/logs/ums-xxl-job
    enabled: true
    admin-addresses: http://127.0.0.1:8081/xxl-job-admin
    access-token: default_token

logging:
