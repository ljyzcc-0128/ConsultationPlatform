ums:
  ai:
    enabled: ${UMS_AI_ENABLED:true}
    api-key: ${UMS_AI_API_KEY:}          # 本地可留空，功能自动降级

  security:
    jwt:
      secret: ${UMS_JWT_SECRET:dev-only-secret-change-me-in-production-32bytes}
    default-provider: LOCAL
    # ---------- 方式二：IAM 用户名密码认证（登录页"IAM 账号登录"模式） ----------
    # 后端约定（IamAuthProvider）：POST {auth-api-url}，JSON body {"username","password"}，
    # 成功返回 200 + 用户信息 JSON（externalId/username/displayName/email/roles/status），
    # 凭证错误返回 401。若 JIP 网关接口格式不同，把调用示例发我，我来适配代码。
    # 待填三项（在 JIP 控制台找「用户名密码认证/登录认证」类 IAM4 接口）：
    #   1. auth-api-url —— 认证 API 地址
    #   2. auth-mode    —— API_KEY（X-API-Key 头）/ BEARER（Authorization: Bearer 头）/ NONE
    #   3. api-key / bearer-token —— 对应的调用凭证
    # 三项填齐后把 enabled 改为 true，登录页点"IAM 账号登录"即可真实校验。
    iam:
      enabled: true
      auth-api-url: "https://jiptest.jinkosolar.com/JIP/IAM/IAM4_OAuth_getUserInfo_header1/1.0.0"                     # TODO：JIP 认证 API 地址
      auth-mode: API_KEY
      api-key: "IAM4_OAuth_getUserInfo_header1"                          # TODO：网关分配的 API Key
      bearer-token: ""
    # ---------- 晶彩单点登录（IAM OAuth 2.0 授权码模式 · JIP 测试环境） ----------
    # 凭证来源：JIP 测试租户 APP189；接口以《晶科能源IAM-OAuth2.0单点认证集成文档》为准
    #   getCode（浏览器跳转拿授权码）：登录页"IAM 账号登录"按钮直连，前端常量配置
    #   getToken（后端调用）：下方 token-url；getUserInfo（后端调用，网关 JWT 鉴权）：下方 userinfo-url
    #   callback-url：77 服务器回调；若 IAM 校验回调白名单，
    #     需让 IAM 负责人（石正浩）把该地址加进 APP189 的回调登记
    sso:
      enabled: true
      # 授权端点（JIP 网关 IAM4_OAuth_getCode）：浏览器整页跳转用，
      # 前端通过 GET /api/auth/sso/config 动态读取，换环境只改这里/环境变量
      authorize-url: "https://jiptest.jinkosolar.com/JIP/IAM/IAM4_OAuth_getCode/1.0.0"
      # token 端点（JIP 网关 IAM4_OAuth_getToken）：POST 表单 code 换 access_token（文档 2.2 节）
      token-url: "https://jiptest.jinkosolar.com/JIP/IAM/IAM4_OAuth_getToken/1.0.0"
      # 用户信息端点（文档 2.3 节，方案二 JWT 网关鉴权）：POST 表单 access_token 换 uid。
      # 路由已探测确认：IAM4_OAuth_getUserInfo_JWT（大写）存在，未带 JWT 时返回 401
      userinfo-url: "https://jiptest.jinkosolar.com/JIP/IAM/IAM4_OAuth_getUserInfo_JWT/1.0.0"
      # IAM 全局注销端点（文档 2.4 节）：前端清本地会话后 302 到本系统
      # /api/auth/sso/logout，由后端 302 到此地址并携带 redirectUrl 回登录页；
      # 正式环境换 https://iam.jinkosolar.com/portal/sso/logout.html
      logout-url: "https://iamtest.jinkosolar.com/portal/sso/logout.html"
      client-id: "APP189"
      client-secret: "ea5a6708-8669-4c1d-860d-449b4068"   # 测试凭证，仅 dev 环境使用
      callback-url: "http://10.21.13.77/api/auth/sso/callback"
      frontend-landing-url: "http://10.21.13.77/sso/landing"
      # JIP 网关鉴权（《晶科能源JIP-接口鉴权说明》第 2 节）：
      #   NONE —— 静态透传 gateway-authorization（KeyAuth-Header 方式，
      #           或 KeyAuth-Params 把 Key 直接拼进上面两个 URL；手工验证 HMAC 也走这里）
      #   JWT  —— 本系统现用方式（文档 2.3 方案二），每次请求动态生成网关 JWT
      #     （Authorization: Bearer，5 分钟有效，只挂在 userinfo 端点）：
      #     gateway-username: "<JIP 平台租户 jwtKey>"      # JWT iss 字段，走环境变量
      #     gateway-secret 走环境变量 UMS_SECURITY_SSO_GATEWAYSECRET（HMAC256 签名密钥，不入库）
      gateway-auth-mode: JWT
      # JIP 网关 JWT 凭证（联调测试值，仅 dev 环境；2026-11-04 实测 iss 未在网关注册，
      # 需 JIP 管理员确认 APP189 的 jwtKey 登记后即可调通；环境变量可覆盖）
      gateway-username: "${UMS_SECURITY_SSO_GATEWAYUSERNAME:ES_IP-XE2RNWGW}"
      gateway-secret: "${UMS_SECURITY_SSO_GATEWAYSECRET:3cab6975-1c4f-4f64-89fd-f4442ba30bd5}"
      gateway-authorization: ""
      gateway-date-header: ""
      # 联调旁路（仅测试环境！）：true = 回调跳过 IAM 校验，
      # 直接以测试账号 debug_test（USER+ADMIN）签发 JWT 进入业务页面。
      # IAM 出网打通后改回 false 即恢复真实校验（生产默认 false）
      debug-bypass: false

  admin:
