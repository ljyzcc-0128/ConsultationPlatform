    agent-id: "5099743148"
    receivers: "971880798"                 # TODO：接收人钉钉 userid，逗号分隔
    card-link: "${UMS_JINGCAI_CARDLINK:http://10.21.13.77/supply-chain}"   # 卡片跳转地址，生产用环境变量覆盖

