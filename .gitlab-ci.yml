# GitLab CI 基线流水线
# 三条产品线按路径增量触发：Java 后端 / Vite 前端 / Python 爬虫
# 后续在此基线上插入 AI 阶段（MR 代码评审、变更摘要），见 docs 注释与 deploy 前的 ai-review 预留段

workflow:
  rules:
    # MR 流水线 + dev/main 分支推送触发；其他分支/tag 不跑
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - build
  - test
  - ai-review
  - package
  - deploy

# ---------- Java 后端（Spring Boot 17 / Maven） ----------
backend:compile:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  rules:
    - changes:
        - services/ums-main-java/**/*
  script:
    - mvn -q compile
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  rules:
    - changes:
        - services/ums-main-java/**/*
  script:
    - mvn test
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  artifacts:
    when: always
    reports:
      junit: services/ums-main-java/target/surefire-reports/TEST-*.xml
    expire_in: 1 week

backend:package:
  stage: package
  image: maven:3.9-eclipse-temurin-17
  rules:
    # 仅 dev/main 跑打包（MR 阶段测试通过即可）
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - services/ums-main-java/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - services/ums-main-java/**/*
  script:
    - mvn -q package -DskipTests
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  artifacts:
    paths:
      - services/ums-main-java/target/*.jar
    expire_in: 1 week

# ---------- 前端（React + Vite） ----------
frontend:build:
  stage: build
  image: node:20
  rules:
    - changes:
        - services/ums-web/**/*
  script:
    - cd services/ums-web
    - npm ci
    # 类型检查 + 构建作为基线质量门禁
    - npx tsc --noEmit
    - npm run build
  cache:
    key: npm-cache
    paths:
      - services/ums-web/.npm
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/services/ums-web/.npm"
  artifacts:
    paths:
      - services/ums-web/dist/
    expire_in: 1 week

# ---------- Python 爬虫 ----------
crawler:test:
  stage: test
  image: python:3.11
  rules:
    - changes:
        - services/ums-crawler-py/**/*
  script:
    - cd services/ums-crawler-py
    - pip install --cache-dir .pip-cache -r requirements.txt
    - mkdir -p reports && python -m pytest --junitxml=reports/junit.xml
  cache:
    key: pip-cache
    paths:
      - services/ums-crawler-py/.pip-cache
  artifacts:
    when: always
    reports:
      junit: services/ums-crawler-py/reports/junit.xml
    expire_in: 1 week
  # 爬虫测试依赖外网数据源时可能不稳定：先不阻断流水线，稳定后移除
  allow_failure: true

# ---------- AI 代码评审（MR 专用，只评论不阻断） ----------
# 需在项目 CI/CD Variables 配置（Settings > CI/CD > Variables，均建议勾选 Masked）：
#   GITLAB_REVIEW_TOKEN  : api scope 的 Personal Access Token（读 diff + 贴 MR 评论）
#   UMS_LLM_BASE_URL / UMS_LLM_API_KEY / UMS_LLM_MODEL : LLM 接入（与后端应用同一套环境变量名）
# 未配置时自动跳过，不影响流水线
ai:review:
  stage: ai-review
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  script:
    - python3 .gitlab/ci/ai_review.py

# ---------- 部署（手动，方案A：部署服务器本地 runner） ----------
# 前提：部署服务器上装有 gitlab-runner，注册时 tag 为 "deploy"（shell executor、root 运行、开机自启）
# 路径/端口均可通过项目 CI/CD Variables 覆盖（不配则用默认值）：
#   DEPLOY_JAR_PATH     jar 落地路径        默认 /opt/ums/ums-main.jar
#   DEPLOY_WEB_DIR      前端 dist 目录      默认 /opt/ums/web
#   UMS_SERVICE_NAME    systemd 服务名      默认 ums-main
#   DEPLOY_HEALTH_PORT  健康检查端口        默认 8080
deploy:backend:
  stage: deploy
  tags: [deploy]
  needs: ["backend:package"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
  script:
    - 'JAR=$(ls services/ums-main-java/target/ums-main-*.jar | head -1); test -n "$JAR" || (echo "未找到 jar 产物"; exit 1)'
    - 'install -D -m 644 "$JAR" "${DEPLOY_JAR_PATH:-/opt/ums/ums-main.jar}"'
    - 'systemctl restart "${UMS_SERVICE_NAME:-ums-main}"'
    - |
      echo "等待服务监听 ${DEPLOY_HEALTH_PORT:-8080} ..."
      for i in $(seq 1 30); do
        sleep 2
        if timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/${DEPLOY_HEALTH_PORT:-8080}" 2>/dev/null; then
          echo "服务已启动（${i}次探测）"; exit 0
        fi
      done
      echo "健康检查超时，请查日志: journalctl -u ${UMS_SERVICE_NAME:-ums-main} -n 100"; exit 1
  environment:
    name: dev

deploy:web:
  stage: deploy
  tags: [deploy]
  needs: ["frontend:build"]
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
  script:
    - 'mkdir -p "${DEPLOY_WEB_DIR:-/opt/ums/web}"'
    - 'rsync -a --delete services/ums-web/dist/ "${DEPLOY_WEB_DIR:-/opt/ums/web}/"'
    - 'echo "前端已发布到 ${DEPLOY_WEB_DIR:-/opt/ums/web}（静态文件无需重启 nginx）"'
  environment:
    name: dev
