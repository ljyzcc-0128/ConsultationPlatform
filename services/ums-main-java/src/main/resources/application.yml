spring:
  application:
    name: ums-main

  # 默认激活 dev，生产通过启动参数/环境变量覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Flyway 公共配置（连接信息在各自 profile 中）
  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# 业务公共开关（具体值在 profile 中定义）
ums:
  ai:
    enabled: true
    model: glm-4-flash
    timeout-seconds: 60
    base-url: https://open.bigmodel.cn/api/paas/v4

  security:
    jwt:
      ttl-minutes: 480
    default-provider: LOCAL
    iam:
      enabled: false
      auth-mode: API_KEY
      timeout-seconds: 10
      auto-provision: true
      default-roles: USER
    sso:
      enabled: false
      authorize-url: https://iam.jinkosolar.com/sso/oidc1/dAuthorize
      timeout-seconds: 10
      auto-provision: true
      default-roles: USER

  scheduler:
    trigger-limit: 10

  jingcai:
    enabled: false
    timeout-seconds: 10

  xxl-job:
    enabled: false
    appname: ums-main-executor
    port: 9999

logging:
  level:
    com.example.ums: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info